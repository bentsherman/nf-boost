
plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.16'
}

version = file('VERSION').text.trim()

nextflowPlugin {
    nextflowVersion = '26.10.0'

    provider = 'nextflow'
    className = 'nextflow.boost.BoostPlugin'
    extensionPoints = [
        'nextflow.boost.BoostConfig',
        'nextflow.boost.BoostExtension',
        'nextflow.boost.BoostObserverFactory',
        'nextflow.boost.cleanup.CleanupCacheStrategy',
        'nextflow.boost.cleanup.CleanupTaskHasherFactory'
    ]
}

dependencies {
    compileOnly 'io.nextflow:nf-lineage:26.10.0'
    testImplementation 'io.nextflow:nf-lineage:26.10.0'
}

// keep parameter names in the plugin spec
compileGroovy.groovyOptions.parameters = true
